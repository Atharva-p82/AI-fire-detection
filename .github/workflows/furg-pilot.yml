name: FireWatch FURG Pilot Evaluation

on:
  push:
    branches:
      - research-evaluation-kit
    paths:
      - ".github/workflows/furg-pilot.yml"
      - "evaluation/**"
      - "backend/**"
      - "docs/FAST_PILOT_EVALUATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firewatch-furg-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-level-pilot:
    name: Run FURG event-level pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out Fire Guard AI research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"

      - name: Install Fire Guard AI dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify bundled checkpoint
        run: |
          test -s backend/best.pt
          sha256sum backend/best.pt

      - name: Download FURG video dataset
        run: |
          git clone --depth 1 https://github.com/steffensbola/furg-fire-dataset.git \
            evaluation/furg_fire_dataset
          echo "MP4 files: $(find evaluation/furg_fire_dataset -type f -iname '*.mp4' | wc -l)"
          echo "XML files: $(find evaluation/furg_fire_dataset -type f -iname '*.xml' | wc -l)"

      - name: Convert XML annotations into event intervals
        run: |
          mkdir -p evaluation/furg_pilot_results
          python evaluation/prepare_furg_events.py \
            --dataset evaluation/furg_fire_dataset \
            --output evaluation/furg_events.csv \
            2>&1 | tee evaluation/furg_pilot_results/annotation_conversion.log

      - name: Run event-level benchmark
        run: |
          set -o pipefail
          python evaluation/run_video_benchmark.py \
            --videos evaluation/furg_fire_dataset \
            --events evaluation/furg_events.csv \
            --output evaluation/furg_pilot_results \
            --persistence 1 2 3 5 \
            --track-iou 0.30 \
            2>&1 | tee evaluation/furg_pilot_results/benchmark.log

      - name: Upload raw pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewatch-furg-pilot-results
          path: |
            evaluation/furg_events.csv
            evaluation/furg_pilot_results/
          if-no-files-found: warn
          retention-days: 30
